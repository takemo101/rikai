<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rikai</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <button id="btn-side" class="ghost small" title="左の一覧を、しまう／出す" aria-label="左の一覧を、しまう／出す" aria-expanded="true">☰</button>
      <div class="brand">rikai</div>
      <div id="top-title"></div>
      <div class="spacer"></div>
      <div id="top-status"></div>
      <button id="btn-submit" class="primary" disabled>Submit</button>
      <button id="btn-end" class="ghost">終了</button>
    </header>
    <aside id="side"></aside>
    <main id="doc">
      <div id="docbar"></div>
      <div id="docscroll">
        <article id="article" class="md"></article>
        <div id="badges" aria-hidden="true"></div>
        <div id="regsel" hidden aria-label="範囲を選ぶ"></div>
      </div>
    </main>
    <aside id="threads"></aside>
    <div id="panel-resizer" role="separator" aria-orientation="vertical" aria-label="コメントの幅（ドラッグ、または左右の矢印キーで変える。ダブルクリックでもとの幅）" title="ドラッグで、コメントの幅を変える（ダブルクリックで、もとの幅）" tabindex="0" aria-valuemin="280"></div>
  </div>

  <button id="selbtn" hidden>コメント</button>
  <button id="blkbtn" hidden title="このブロックにコメント">＋</button>
  <button id="regbtn" hidden title="画像・図の、一部の範囲を選んで、コメント">範囲</button>
  <div id="toast" hidden></div>

  <dialog id="submitdlg">
    <form method="dialog">
      <h3>AI に送信</h3>
      <p id="submitdlg-summary"></p>
      <label class="note-label">全体へのメモ（任意）
        <textarea id="submitdlg-note" rows="3" placeholder="特定の箇所に紐づかない伝言があれば"></textarea>
      </label>
      <div class="dlg-actions">
        <button value="cancel" class="ghost">キャンセル</button>
        <button id="submitdlg-ok" value="ok" class="primary">送信する</button>
      </div>
    </form>
  </dialog>

  <div id="ended" hidden>
    <div class="ended-box" id="ended-box"></div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/anchor.js"></script>
  <script src="/diff.js"></script>
  <script src="/progress.js"></script>
  <script src="/fmt.js"></script>
  <script src="/app.js"></script>
</body>
</html>
